<!DOCTYPE html>
<html>
<head>
  <title>Orbixa Store</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;

      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
      url('https://images.unsplash.com/photo-1523275335684-37898b6baf30');

      background-size: cover;
      background-position: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 32px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      width: 180px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.08);
    }

    .card h3 {
      margin: 10px 0;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.8;
    }

    .cart-box {
      margin-top: 20px;
      background: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 10px;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
    }

    li {
      margin: 5px 0;
    }
  </style>
</head>

<body>

<h1>🛍️ Orbixa</h1>
<p>Your world of smart shopping</p>

<div class="products">

  <div class="card">
    <h3>T-Shirt</h3>
    <p>$20</p>
    <button onclick="addToCart('T-Shirt', 20)">Add</button>
  </div>

  <div class="card">
    <h3>Shoes</h3>
    <p>$50</p>
    <button onclick="addToCart('Shoes', 50)">Add</button>
  </div>

  <div class="card">
    <h3>Cap</h3>
    <p>$15</p>
    <button onclick="addToCart('Cap', 15)">Add</button>
  </div>

</div>

<div class="cart-box">
  <h2>🛒 Cart</h2>
  <ul id="cart"></ul>
  <h3 id="total">Total: $0</h3>
</div>

<script>
let cart = [];

function addToCart(name, price) {
  cart.push({ name, price });
  showCart();
}

function showCart() {
  let cartList = document.getElementById("cart");
  let total = 0;
  cartList.innerHTML = "";

  cart.forEach(item => {
    let li = document.createElement("li");
    li.textContent = item.name + " - $" + item.price;
    cartList.appendChild(li);
    total += item.price;
  });

  document.getElementById("total").textContent = "Total: $" + total;
}
</script>

</body>
</html>

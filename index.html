<!DOCTYPE html>
<html>
<head>
  <title>Orbixa Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f1f3f6;
    }

    /* NAVBAR */
    .navbar {
      background: #131921;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      position: sticky;
      top: 0;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #ffb300;
    }

    .search {
      width: 50%;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    .cart-btn {
      background: #ffb300;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* BANNER */
    .banner {
      background: linear-gradient(90deg, #6a00ff, #b300ff);
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 18px;
    }

    /* PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
    }

    .price {
      color: green;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 8px;
      background: #ffb300;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 5px;
    }

    /* CART */
    .cart {
      position: fixed;
      right: 0;
      top: 0;
      width: 320px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      padding: 10px;
      overflow-y: auto;
      display: none;
    }

    .cart h2 {
      text-align: center;
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }

    .checkout {
      background: green;
      color: white;
      padding: 10px;
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    @media(max-width:768px){
      .search { width: 40%; }
      .cart { width: 100%; }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">🛍️ Orbixa Store</div>
  <input class="search" placeholder="Search products...">
  <button class="cart-btn" onclick="toggleCart()">Cart</button>
</div>

<!-- BANNER -->
<div class="banner">
  🔥 Big Deals Today - Shop Smart, Save More!
</div>

<!-- PRODUCTS -->
<div class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
    <h3>T-Shirt</h3>
    <p class="price">$20</p>
    <button onclick="add('T-Shirt',20)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1528701800489-20be9c7b1f55">
    <h3>Shoes</h3>
    <p class="price">$50</p>
    <button onclick="add('Shoes',50)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3">
    <h3>Headphones</h3>
    <p class="price">$60</p>
    <button onclick="add('Headphones',60)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f">
    <h3>Backpack</h3>
    <p class="price">$35</p>
    <button onclick="add('Backpack',35)">Add to Cart</button>
  </div>

</div>

<!-- CART -->
<div class="cart" id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cart"></div>
  <div class="total" id="total">Total: $0</div>
  <div class="checkout" onclick="checkout()">Checkout</div>
</div>

<script>
let cart = [];

function toggleCart(){
  let box = document.getElementById("cartBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function add(name, price){
  cart.push({name, price});
  render();
}

function render(){
  let cartDiv = document.getElementById("cart");
  let total = 0;
  cartDiv.innerHTML = "";

  cart.forEach(item => {
    let div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<span>${item.name}</span><span>$${item.price}</span>`;
    cartDiv.appendChild(div);
    total += item.price;
  });

  document.getElementById("total").innerText = "Total: $" + total;
}

function checkout(){
  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }
  alert("Order Placed Successfully 🚀");
  cart = [];
  render();
}
</script>

</body>
</html>

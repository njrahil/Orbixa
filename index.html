<!DOCTYPE html>
<html>
<head>
  <title>Orbixa Pro Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000000, #12001f, #1a0033);
      color: #e6ccff;
    }

    h1 {
      text-align: center;
      color: #b46cff;
      text-shadow: 0 0 10px #7a2cff;
      margin: 15px 0;
    }

    /* PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: rgba(20, 0, 40, 0.8);
      border: 1px solid #7a2cff55;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #a64dff66;
    }

    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: linear-gradient(45deg, #6a00ff, #b300ff);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* CART */
    .cart {
      position: fixed;
      right: 0;
      top: 0;
      width: 300px;
      height: 100%;
      background: rgba(10,0,20,0.95);
      border-left: 2px solid #7a2cff;
      padding: 15px;
      overflow-y: auto;
    }

    .cart h2 {
      text-align: center;
      color: #b46cff;
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 14px;
    }

    .qty-btn {
      padding: 2px 6px;
      margin: 0 3px;
      cursor: pointer;
    }

    .total {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }

    .checkout {
      margin-top: 10px;
      background: green;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .cart {
        width: 100%;
        height: 40%;
        bottom: 0;
        top: auto;
      }
    }
  </style>
</head>

<body>

<h1>🛍️ Orbixa Pro Store</h1>

<div class="products">

  <div class="card">
    <h3>T-Shirt</h3>
    <p>$20</p>
    <button onclick="add('T-Shirt',20)">Add</button>
  </div>

  <div class="card">
    <h3>Shoes</h3>
    <p>$50</p>
    <button onclick="add('Shoes',50)">Add</button>
  </div>

  <div class="card">
    <h3>Cap</h3>
    <p>$15</p>
    <button onclick="add('Cap',15)">Add</button>
  </div>

</div>

<!-- CART -->
<div class="cart">
  <h2>🛒 Cart</h2>
  <div id="cart"></div>
  <div class="total" id="total">Total: $0</div>
  <div class="checkout" onclick="checkout()">Checkout</div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save() {
  localStorage.setItem("cart", JSON.stringify(cart));
}

function add(name, price) {
  let item = cart.find(i => i.name === name);
  if(item) {
    item.qty++;
  } else {
    cart.push({name, price, qty:1});
  }
  save();
  render();
}

function removeItem(name) {
  cart = cart.filter(i => i.name !== name);
  save();
  render();
}

function changeQty(name, val) {
  let item = cart.find(i => i.name === name);
  if(item) {
    item.qty += val;
    if(item.qty <= 0) removeItem(name);
  }
  save();
  render();
}

function render() {
  let box = document.getElementById("cart");
  box.innerHTML = "";
  let total = 0;

  cart.forEach(i => {
    total += i.price * i.qty;

    let div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      ${i.name} - $${i.price}
      <div>
        <button class="qty-btn" onclick="changeQty('${i.name}',-1)">-</button>
        ${i.qty}
        <button class="qty-btn" onclick="changeQty('${i.name}',1)">+</button>
        <button onclick="removeItem('${i.name}')">x</button>
      </div>
    `;
    box.appendChild(div);
  });

  document.getElementById("total").innerText = "Total: $" + total;
}

function checkout() {
  if(cart.length === 0) {
    alert("Cart is empty!");
    return;
  }

  let summary = cart.map(i => `${i.name} x${i.qty}`).join("\n");
  alert("Order Placed!\n\n" + summary);

  cart = [];
  save();
  render();
}

render();
</script>

</body>
</html>
